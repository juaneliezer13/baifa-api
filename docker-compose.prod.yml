services:
  api:
    image: ${DOCKER_IMAGE:-juaneliezer13/baifa-api:release-1.0.5}
    container_name: baifa-api
    restart: unless-stopped
    ports:
      - "11001:80"
    env_file:
      - .env
    volumes:
      - storage_public:/var/www/storage/app/public
    networks:
      - baifa-network

networks:
  baifa-network:
    driver: bridge

volumes:
  storage_public:
    driver: local
