services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: baifa_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - baifa_network
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    container_name: baifa_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - baifa_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: baifa_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: baifa_app
      MYSQL_USER: baifa_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - baifa_dbdata:/var/lib/mysql
    networks:
      - baifa_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  baifa_network:
    driver: bridge

volumes:
  baifa_dbdata:
    driver: local
