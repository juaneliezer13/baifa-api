services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: baifa_api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/production/php.ini:/usr/local/etc/php/conf.d/99-baifa-production.ini
    networks:
      - baifa_network
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:alpine
    container_name: baifa_api_webserver
    restart: unless-stopped
    ports:
      - "${API_PORT:-14001}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - baifa_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: baifa_api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-baifa_api}
      MYSQL_USER: ${DB_USERNAME:-baifa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - "${DB_EXTERNAL_PORT:-14002}:3306"
    volumes:
      - baifa_api_dbdata:/var/lib/mysql
    networks:
      - baifa_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

networks:
  baifa_network:
    driver: bridge

volumes:
  baifa_api_dbdata:
    driver: local
