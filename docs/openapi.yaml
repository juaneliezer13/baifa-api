openapi: 3.1.0
info:
  title: baifa-api
  description: >
    Especificación OpenAPI de la API RESTful **baifa-api**.
    Desarrollada con Laravel 12 y Docker Compose (Nginx, PHP 8.4-FPM y MySQL 8.0).
    Incluye autenticación mediante Bearer Tokens con **Laravel Sanctum** y control de roles:
    Cliente (`client`), Empleado (`employee`), Jefe/Gerente (`manager`) y Administrador (`admin`).
  version: 1.0.3
  contact:
    name: Juan Chirinos
    email: juaneliezer13@gmail.com

servers:
  - url: http://localhost:8000/api
    description: Entorno de Desarrollo Local (Docker)

tags:
  - name: Autenticación
    description: Registro, inicio de sesión, perfil y revocación de tokens con Laravel Sanctum.
  - name: Sistema
    description: Endpoints de diagnóstico, métricas y estado del sistema.
  - name: Clientes
    description: Directorio fiscal de empresas clientes, ficha jurídica y personas de contacto.
  - name: Generadores
    description: Catálogo de inventario, equipos asignados, métricas y control de estados (Etapa 2).
  - name: Tracking / Checkpoints
    description: Consulta rápida de trazabilidad por serial y registro manual de puntos de control inmutables (Etapas 3 y 4).
  - name: Soporte / Helpdesk
    description: Creación de tickets de soporte, gestión de tickera interna, asignación de operadores, chat en vivo y bitácora de evolución.

paths:
  /v1/health:
    get:
      tags:
        - Sistema
      summary: Diagnóstico y estado de salud de la API
      description: Comprueba el estado del servicio y la conectividad activa con MySQL.
      operationId: getHealthStatus
      responses:
        '200':
          description: API y base de datos operativas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Error interno o pérdida de conexión con la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registro de nuevo usuario
      description: >
        Crea una nueva cuenta de usuario en el sistema y emite inmediatamente un Bearer Token.
        Si no se especifica rol, se asigna `client` por defecto. Despacha correo de bienvenida y registro al cliente (RN-NOTIF-02).
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente con token generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Errores de validación (email duplicado, contraseña corta, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicio de sesión
      description: Autentica credenciales de usuario y emite un nuevo Bearer Token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas y token generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Credenciales incorrectas o campos faltantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: Perfil del usuario autenticado
      description: Retorna los datos y rol del usuario asociado al Bearer Token actual.
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado o token inválido/expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cierre de sesión
      description: Revoca y elimina el token de acceso actual en la base de datos.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada y token revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/clients:
    get:
      tags:
        - Clientes
      summary: Listado del directorio fiscal de clientes
      description: Retorna la lista de clientes con soporte para búsqueda textual y filtro de estado.
      operationId: listClients
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Término de búsqueda en razón social, nombre corto, RIF o contacto.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por estado (active, inactive, all).
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
      responses:
        '200':
          description: Listado obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          description: No autenticado.
        '403':
          description: Permisos insuficientes (exclusivo para personal operativo).

    post:
      tags:
        - Clientes
      summary: Registro de nueva empresa cliente
      description: >
        Da de alta una nueva empresa en el directorio fiscal y genera automáticamente una cuenta de usuario
        con rol 'client' utilizando el nombre y correo de contacto, enviándole sus credenciales iniciales.
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreClientRequest'
      responses:
        '201':
          description: Cliente registrado exitosamente y usuario vinculado autogenerado.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliente y usuario de acceso creados exitosamente.
                  client:
                    $ref: '#/components/schemas/Client'
        '422':
          description: Error de validación (RIF duplicado, correo ya existente en usuarios, etc.).

  /v1/clients/{id}:
    get:
      tags:
        - Clientes
      summary: Ficha técnica detallada de un cliente
      operationId: getClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ficha obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
        '404':
          description: Cliente no encontrado.

    put:
      tags:
        - Clientes
      summary: Actualización de datos de un cliente
      description: >
        Actualiza los datos fiscales o de contacto de una empresa cliente. Si se modifica el correo de contacto,
        se sincroniza automáticamente con la cuenta de usuario vinculada.
      operationId: updateClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Cliente actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: '#/components/schemas/Client'

    delete:
      tags:
        - Clientes
      summary: Eliminación de cliente y usuario asociado
      description: >
        Elimina lógicamente (SoftDelete) la empresa del directorio fiscal y elimina definitivamente su usuario
        cliente asociado en la tabla users, revocando todos sus tokens de acceso.
      operationId: deleteClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente y su usuario asociado eliminados exitosamente.

  /v1/clients/{id}/toggle-status:
    patch:
      tags:
        - Clientes
      summary: Alternar estado activo / inactivo de un cliente
      operationId: toggleClientStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
  /v1/generators/summary:
    get:
      tags:
        - Generadores
      summary: Resumen numérico y métricas de generadores por estado
      description: Retorna contadores agregados por cada uno de los 5 estados operativos.
      operationId: getGeneratorsSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Métricas calculadas exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratorSummaryResponse'

  /v1/generators:
    get:
      tags:
        - Generadores
      summary: Listado de generadores eléctricos del catálogo
      description: Retorna los equipos registrados con filtros opcionales por búsqueda textual, estado y cliente.
      operationId: getGenerators
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Término de búsqueda por serial, modelo o cliente.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filtro por estado operativo.
          schema:
            $ref: '#/components/schemas/GeneratorStatus'
        - name: client_id
          in: query
          required: false
          description: Filtro por ID de cliente asociado.
          schema:
            type: integer
      responses:
        '200':
          description: Listado de generadores obtenido correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Generator'

    post:
      tags:
        - Generadores
      summary: Registrar nuevo generador eléctrico en inventario
      description: Da de alta un nuevo equipo capturando serial, modelo, cliente, ETA y fotografía referencial.
      operationId: storeGenerator
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreGeneratorRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/StoreGeneratorRequest'
      responses:
        '201':
          description: Generador registrado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  generator:
                    $ref: '#/components/schemas/Generator'
        '422':
          description: Error de validación (serial duplicado, campos faltantes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /v1/generators/{id}:
    get:
      tags:
        - Generadores
      summary: Ficha técnica detallada de un generador
      operationId: getGeneratorById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ficha del generador obtenida con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generator:
                    $ref: '#/components/schemas/Generator'

    put:
      tags:
        - Generadores
      summary: Actualizar datos técnicos o estado de un generador
      description: >
        Actualiza los datos técnicos o estatus de un generador. Si el generador está asignado
        a un cliente y se detectan cambios o transiciones de estatus, se despacha automáticamente
        una notificación por correo electrónico al cliente (RN-NOTIF-04).
      operationId: updateGenerator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateGeneratorRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneratorRequest'
      responses:
        '200':
          description: Generador actualizado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  generator:
                    $ref: '#/components/schemas/Generator'

    delete:
      tags:
        - Generadores
      summary: Eliminar lógicamente un generador del catálogo
      operationId: deleteGenerator
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Generador eliminado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /v1/tracking/{serial_number}:
    get:
      tags:
        - Tracking / Checkpoints
      summary: Consulta de trazabilidad de un generador por serial
      description: >
        Obtiene la ficha de un generador y su historial cronológico de puntos de control
        a partir de su serial de fábrica. Permite a clientes consultar exclusivamente sus
        propios generadores (RN-PRT-02, RN-TRK-01).
      operationId: trackBySerial
      security:
        - bearerAuth: []
      parameters:
        - name: serial_number
          in: path
          required: true
          description: Serial de fábrica único del equipo (ej. GEN-2026-0041).
          schema:
            type: string
            example: GEN-2026-0041
      responses:
        '200':
          description: Información del generador y bitácora de trazabilidad.
          content:
            application/json:
              schema:
                type: object
                properties:
                  generator:
                    $ref: '#/components/schemas/Generator'
        '403':
          description: Usuario con rol cliente no autorizado a consultar este equipo.
        '404':
          description: Generador no encontrado con el serial suministrado.

  /v1/generators/{generator}/checkpoints:
    get:
      tags:
        - Tracking / Checkpoints
      summary: Listado cronológico de puntos de control de un generador
      description: >
        Devuelve la lista completa y ordenada cronológicamente de puntos de control
        alcanzados por el generador (RN-BIT-01).
      operationId: getCheckpoints
      security:
        - bearerAuth: []
      parameters:
        - name: generator
          in: path
          required: true
          description: ID numérico del generador.
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Lista de checkpoints del generador.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Checkpoint'
        '403':
          description: Acceso no autorizado para el cliente.
        '404':
          description: Generador no encontrado.

    post:
      tags:
        - Tracking / Checkpoints
      summary: Registro manual de nuevo punto de control (avance de ruta)
      description: >
        Registra un evento inmutable en la bitácora del generador y actualiza
        automáticamente su estado logístico principal (RN-TRK-01, RN-TRK-02).
        Si el equipo está asignado a un cliente, despacha automáticamente una notificación por correo electrónico (RN-NOTIF-05).
        Requiere rol admin, manager o employee.
      operationId: storeCheckpoint
      security:
        - bearerAuth: []
      parameters:
        - name: generator
          in: path
          required: true
          description: ID numérico del generador.
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCheckpointRequest'
      responses:
        '201':
          description: Punto de control registrado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Punto de control registrado exitosamente.
                  checkpoint:
                    $ref: '#/components/schemas/Checkpoint'
                  generator:
                    $ref: '#/components/schemas/Generator'
        '403':
          description: Rol no autorizado para registrar puntos de control.
        '422':
          description: Error de validación en los datos del punto de control.

  /v1/support/tickets:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Listado general de tickets en la Tickera (Personal Interno)
      description: Permite a administradores, gerentes y empleados consultar todos los tickets de soporte con filtros avanzados.
      operationId: getSupportTickets
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_progress, finished, cancelled]
        - name: category
          in: query
          schema:
            type: string
        - name: assigned_to
          in: query
          description: me, unassigned o ID de usuario operador
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 15
      responses:
        '200':
          description: Listado paginado de tickets de soporte.
        '403':
          description: Rol no autorizado (solo personal interno).
    post:
      tags:
        - Soporte / Helpdesk
      summary: Generar nuevo ticket de soporte (Cliente)
      description: Permite al cliente abrir una consulta. Genera código TKT-YYYY-XXXX y estado inicial pending.
      operationId: createSupportTicket
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        '201':
          description: Ticket generado exitosamente.
        '422':
          description: Error de validación (título obligatorio).

  /v1/support/active-ticket:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Consultar ticket activo del cliente
      description: Obtiene el ticket en curso (pending o in_progress) para desplegar el chat flotante. Si no tiene, retorna data null.
      operationId: getActiveSupportTicket
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estado del ticket activo del cliente.

  /v1/support/my-tickets:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Mis Consultas (Historial del Cliente)
      description: Permite al cliente listar todas sus consultas históricas categorizadas por área y estatus.
      operationId: getMySupportTickets
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Listado paginado de consultas del cliente.

  /v1/support/tickets/{id}:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Detalle completo de un ticket
      description: Obtiene información del ticket, operador asignado, mensajes de chat y bitácora de evolución.
      operationId: getSupportTicketDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Datos del ticket.
        '403':
          description: No autorizado para ver este ticket.
        '404':
          description: Ticket no encontrado.

  /v1/support/tickets/{id}/assign:
    patch:
      tags:
        - Soporte / Helpdesk
      summary: Asignar u autoasignarse ticket de la tickera
      description: Admin asigna a un empleado o un empleado/admin "toma el ticket". Cambia estatus a in_progress.
      operationId: assignSupportTicket
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTicketRequest'
      responses:
        '200':
          description: Ticket asignado exitosamente.
        '403':
          description: Rol no autorizado.

  /v1/support/tickets/{id}/status:
    patch:
      tags:
        - Soporte / Helpdesk
      summary: Actualizar estatus del ticket (Finalizar o Cancelar)
      description: Permite a admin/empleado cambiar estado. Si es finished o cancelled requiere final_comment obligatorio. Notifica por correo a cliente y empleado.
      operationId: updateSupportTicketStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketStatusRequest'
      responses:
        '200':
          description: Estatus actualizado y notificaciones enviadas.
        '403':
          description: El cliente no puede cambiar estados ni cancelar tickets.
        '422':
          description: Comentario final obligatorio si es finalizado o cancelado.

  /v1/support/tickets/{id}/messages:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Listar mensajes del chat de un ticket
      operationId: getTicketMessages
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Historial de mensajes de chat.
    post:
      tags:
        - Soporte / Helpdesk
      summary: Enviar mensaje al chat del ticket
      operationId: sendTicketMessage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTicketMessageRequest'
      responses:
        '201':
          description: Mensaje enviado exitosamente.
        '422':
          description: No es posible enviar mensajes en tickets cerrados o cancelados.

  /v1/support/tickets/{id}/logs:
    get:
      tags:
        - Soporte / Helpdesk
      summary: Consultar bitácora de evolución del ticket
      description: Historial inmutable de acciones, cambios de estatus y comentarios del ticket.
      operationId: getTicketLogs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bitácora de evolución del ticket.

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Introduce tu token Bearer emitido en /login o /register (ej. `Bearer 1|...`)

  schemas:
    UserRole:
      type: string
      enum:
        - client
        - employee
        - manager
        - admin
      description: |
        Rol de usuario dentro del mini-SaaS:
        * `client`: Cliente final.
        * `employee`: Empleado operativo.
        * `manager`: Jefe o Gerente de área.
        * `admin`: Administrador global del SaaS.
      example: client

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - role_label
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Chirinos
        email:
          type: string
          format: email
          example: juan@example.com
        role:
