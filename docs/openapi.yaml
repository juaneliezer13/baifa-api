openapi: 3.1.0
info:
  title: baifa-api
  description: >
    Especificación OpenAPI de la API RESTful **baifa-api**.
    Desarrollada con Laravel 12 y Docker Compose (Nginx, PHP 8.4-FPM y MySQL 8.0).
    Incluye autenticación mediante Bearer Tokens con **Laravel Sanctum** y control de roles:
    Cliente (`client`), Empleado (`employee`), Jefe/Gerente (`manager`) y Administrador (`admin`).
  version: 1.0.0
  contact:
    name: Juan Chirinos
    email: juaneliezer13@gmail.com

servers:
  - url: http://localhost:8000/api
    description: Entorno de Desarrollo Local (Docker)

tags:
  - name: Autenticación
    description: Registro, inicio de sesión, perfil y revocación de tokens con Laravel Sanctum.
  - name: Sistema
    description: Endpoints de diagnóstico, métricas y estado del sistema.
  - name: Clientes
    description: Directorio fiscal de empresas clientes, ficha jurídica y personas de contacto.

paths:
  /v1/health:
    get:
      tags:
        - Sistema
      summary: Diagnóstico y estado de salud de la API
      description: Comprueba el estado del servicio y la conectividad activa con MySQL.
      operationId: getHealthStatus
      responses:
        '200':
          description: API y base de datos operativas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: Error interno o pérdida de conexión con la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/register:
    post:
      tags:
        - Autenticación
      summary: Registro de nuevo usuario
      description: >
        Crea una nueva cuenta de usuario en el sistema y emite inmediatamente un Bearer Token.
        Si no se especifica rol, se asigna `client` por defecto.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente con token generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Errores de validación (email duplicado, contraseña corta, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /v1/auth/login:
    post:
      tags:
        - Autenticación
      summary: Inicio de sesión
      description: Autentica credenciales de usuario y emite un nuevo Bearer Token.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas y token generado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Credenciales incorrectas o campos faltantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /v1/auth/me:
    get:
      tags:
        - Autenticación
      summary: Perfil del usuario autenticado
      description: Retorna los datos y rol del usuario asociado al Bearer Token actual.
      operationId: getAuthenticatedUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario autenticado.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: No autenticado o token inválido/expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      tags:
        - Autenticación
      summary: Cierre de sesión
      description: Revoca y elimina el token de acceso actual en la base de datos.
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada y token revocado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: No autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/clients:
    get:
      tags:
        - Clientes
      summary: Listado del directorio fiscal de clientes
      description: Retorna la lista de clientes con soporte para búsqueda textual y filtro de estado.
      operationId: listClients
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Término de búsqueda en razón social, nombre corto, RIF o contacto.
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por estado (active, inactive, all).
          required: false
          schema:
            type: string
            enum: [active, inactive, all]
      responses:
        '200':
          description: Listado obtenido exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        '401':
          description: No autenticado.
        '403':
          description: Permisos insuficientes (exclusivo para personal operativo).

    post:
      tags:
        - Clientes
      summary: Registro de nueva empresa cliente
      description: Da de alta una nueva empresa en el directorio fiscal.
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreClientRequest'
      responses:
        '201':
          description: Cliente registrado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cliente registrado exitosamente.
                  client:
                    $ref: '#/components/schemas/Client'
        '422':
          description: Error de validación (RIF duplicado o formato inválido).

  /v1/clients/{id}:
    get:
      tags:
        - Clientes
      summary: Ficha técnica detallada de un cliente
      operationId: getClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ficha obtenida exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
        '404':
          description: Cliente no encontrado.

    put:
      tags:
        - Clientes
      summary: Actualización de datos de un cliente
      operationId: updateClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Cliente actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: '#/components/schemas/Client'

    delete:
      tags:
        - Clientes
      summary: Eliminación lógica de un cliente
      operationId: deleteClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cliente eliminado exitosamente.

  /v1/clients/{id}/toggle-status:
    patch:
      tags:
        - Clientes
      summary: Alternar estado activo / inactivo de un cliente
      operationId: toggleClientStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Estado actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  client:
                    $ref: '#/components/schemas/Client'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Introduce tu token Bearer emitido en /login o /register (ej. `Bearer 1|...`)

  schemas:
    UserRole:
      type: string
      enum:
        - client
        - employee
        - manager
        - admin
      description: |
        Rol de usuario dentro del mini-SaaS:
        * `client`: Cliente final.
        * `employee`: Empleado operativo.
        * `manager`: Jefe o Gerente de área.
        * `admin`: Administrador global del SaaS.
      example: client

    User:
      type: object
      required:
        - id
        - name
        - email
        - role
        - role_label
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Juan Chirinos
        email:
          type: string
          format: email
          example: juan@example.com
        role:
          $ref: '#/components/schemas/UserRole'
        role_label:
          type: string
          description: Nombre del rol legible en español.
          example: Cliente
        created_at:
          type: string
          format: date-time
          example: '2026-09-09T14:35:00+00:00'

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          example: Juan Chirinos
        email:
          type: string
          format: email
          example: juan@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: secret1234
        password_confirmation:
          type: string
          format: password
          example: secret1234
        role:
          $ref: '#/components/schemas/UserRole'

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: juan@example.com
        password:
          type: string
          format: password
          example: secret1234
        device_name:
          type: string
          description: Nombre del dispositivo o cliente (opcional).
          example: vue-spa-frontend

    AuthResponse:
      type: object
      required:
        - message
        - access_token
        - token_type
        - user
      properties:
        message:
          type: string
          example: Inicio de sesión exitoso.
        access_token:
          type: string
          description: Bearer Token generado por Sanctum.
          example: 1|9a8b7c6d5e4f3a2b1c0d...
        token_type:
          type: string
          example: Bearer
        user:
          $ref: '#/components/schemas/User'

    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Sesión cerrada exitosamente.

    HealthResponse:
      type: object
      required:
        - status
        - app
        - database
        - timestamp
      properties:
        status:
          type: string
          example: ok
        app:
          type: string
          example: baifa-api
        database:
          type: string
          example: connected
        timestamp:
          type: string
          format: date-time
          example: '2026-09-09T14:35:00+00:00'

    ValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: Los datos proporcionados no son válidos.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - El campo correo electrónico ya ha sido registrado.

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: No autenticado.

    Client:
      type: object
      required:
        - id
        - company_fiscal_name
        - company_short_name
        - rif
        - contact_name
        - contact_email
        - is_active
        - status
        - status_label
      properties:
        id:
          type: integer
          example: 1
        company_fiscal_name:
          type: string
          example: Industrias Venezolanas Toro S.A.
        company_short_name:
          type: string
          example: IndVen Toro
        rif:
          type: string
          example: J-12345678-9
        office_phone:
          type: string
          nullable: true
          example: 0212-555-0100
        contact_name:
          type: string
          example: Carlos Mendoza
        contact_email:
          type: string
          format: email
          example: cmendoza@indventoro.com.ve
        contact_phone:
          type: string
          nullable: true
          example: 0414-555-0101
        is_active:
          type: boolean
          example: true
        status:
          type: string
          enum: [active, inactive]
          example: active
        status_label:
          type: string
          example: Activo
        user_id:
          type: integer
          nullable: true
        registered_date:
          type: string
          format: date
          example: '2026-09-10'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreClientRequest:
      type: object
      required:
        - company_fiscal_name
        - company_short_name
        - rif
        - contact_name
        - contact_email
      properties:
        company_fiscal_name:
          type: string
          example: Industrias Venezolanas Toro S.A.
        company_short_name:
          type: string
          example: IndVen Toro
        rif:
          type: string
          example: J-12345678-9
        office_phone:
          type: string
          nullable: true
          example: 0212-555-0100
        contact_name:
          type: string
          example: Carlos Mendoza
        contact_email:
          type: string
          format: email
          example: cmendoza@indventoro.com.ve
        contact_phone:
          type: string
          nullable: true
          example: 0414-555-0101
        is_active:
          type: boolean
          example: true
        user_id:
          type: integer
          nullable: true

    UpdateClientRequest:
      type: object
      properties:
        company_fiscal_name:
          type: string
        company_short_name:
          type: string
        rif:
          type: string
        office_phone:
          type: string
          nullable: true
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        user_id:
          type: integer
          nullable: true